spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.web.servlet=INFO
app.reply-mode=${APP_REPLY_MODE:echo}
app.telegram.enabled=${TELEGRAM_ENABLED:true}
app.telegram.token=${TELEGRAM_BOT_TOKEN}
app.telegram.webhook-url=${TELEGRAM_WEBHOOK_URL}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET}
app.viber.enabled=${VIBER_ENABLED:false}
app.viber.token=${VIBER_BOT_TOKEN:}
app.viber.webhook-url=${VIBER_WEBHOOK_URL:}
app.viber.sender-name=${VIBER_SENDER_NAME:Agent Messaging}
app.viber.api-base-url=${VIBER_API_BASE_URL:https://chatapi.viber.com/pa}
app.openai.api-key=${OPENAI_API_KEY}
app.openai.model=${OPENAI_MODEL:gpt-5.4-mini}
